name: Cypress E2E tests

on:
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: STEP 1 - Checkout project
        uses: actions/checkout@v4

      - name: STEP 2 - Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: STEP 3 - Install dependencies
        run: npm install

      - name: STEP 4 - Install Juice Shop
        run: docker pull bkimminich/juice-shop:latest

      - name: STEP 5 - Start Juice Shop
        run: docker run -d -p 3000:3000 bkimminich/juice-shop:latest

      - name: STEP 6 - Wait for Juice Shop
        run: npx wait-on http://localhost:3000

      - name: STEP 7 - Instalar Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          npm install -g allure-commandline --save-dev

      - name: STEP 8 - Run Cypress tests
        run: npm run cy:run

      - name: STEP 9 - Gerar relatório Allure
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: STEP 10 - Deploy Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
