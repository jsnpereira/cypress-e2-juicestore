name: Cypress E2E tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: STEP 1 - Checkout project
        uses: actions/checkout@v4

      - name: STEP 2 - Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: STEP 3 - Install dependencies
        run: npm install

      - name: STEP 4 - Install Juice Shop
        run: docker pull bkimminich/juice-shop:v20.0.0

      - name: STEP 5 - Start Juice Shop

        run: docker run -d -p 3000:3000 bkimminich/juice-shop:v20.0.0

      - name: STEP 6 - Wait for Juice Shop
        run: npx wait-on http://localhost:3000

      - name: STEP 7 - Instalar Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          npm install -g allure-commandline --save-dev

      - name: STEP 8 - checkout gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: STEP 9 - download the allure report history
        if: always()
        run: |
          mkdir -p allure-results/history

          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history/* allure-results/history || true
          fi

      - name: DEBUG history
        run: |
          echo "=== gh-pages/history ==="
          ls -la gh-pages/history || true

          echo "=== allure-results/history ==="
          ls -la allure-results/history || true

      - name: STEP 10 - Run Cypress tests
        if: always()
        run: npm run cy:run

      - name: STEP 11 - Generate Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: STEP 12 - Save the allure history
        if: always()
        run: |
          mkdir -p allure-report/history

           if [ -d "allure-results/history" ]; then
              cp -r allure-results/history/* allure-report/history || true
           fi

      - name: STEP 13 - Deploy the report in the Github Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_branch: gh-pages
          publish_dir: allure-report

